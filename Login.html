<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Billetera Digital</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wallet-container">
        <div id="login-section">
            <h1>Bienvenido</h1>
            <p>Inicia sesión en tu Billetera</p>
            <form id="login-form">
                <input type="text" id="login-user" placeholder="Usuario" required>
                <input type="password" id="login-pass" placeholder="Contraseña" required>
                <button type="submit" class="btn deposit">Ingresar</button>
            </form>
            <p id="login-error" style="color: red;"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
